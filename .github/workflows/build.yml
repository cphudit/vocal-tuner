# Builds the app and runs the headless checks on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet publish -c Release -o out

      - name: Singing-analysis checks (synthetic audio)
        shell: pwsh
        run: |
          $p = Start-Process out\VocalTuner.exe -ArgumentList '--coachtest', "$env:RUNNER_TEMP\coachtest" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\coachtest\coachtest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "coach checks failed" }
