# Pushing a version tag (e.g. v1.2.0) builds the release on GitHub's servers from the tagged source,
# attaches a build-provenance attestation and a SHA-256 checksum, and creates a DRAFT release.
# Review the draft on GitHub, then press "Publish release".
#
# Release notes: put them in docs/release-notes/<tag>.md (e.g. docs/release-notes/v1.2.0.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the draft release
  id-token: write       # sign the attestation
  attestations: write   # store the attestation

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish -c Release -o dist\VocalTuner -p:Version=$version

      - name: Singing-analysis checks (synthetic audio)
        shell: pwsh
        run: |
          $p = Start-Process dist\VocalTuner\VocalTuner.exe -ArgumentList '--coachtest', "$env:RUNNER_TEMP\coachtest" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\coachtest\coachtest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "coach checks failed" }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VocalTuner -DestinationPath VocalTuner-win-x64.zip
          $hash = (Get-FileHash VocalTuner-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  VocalTuner-win-x64.zip" | Out-File -Encoding ascii VocalTuner-win-x64.zip.sha256
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: VocalTuner-win-x64.zip

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $body = if (Test-Path $notes) { Get-Content $notes -Raw -Encoding UTF8 } else { "" }
          $body += @"

          ### Download
          **``VocalTuner-win-x64.zip``** below: unzip anywhere and run ``VocalTuner.exe``. No installer, and .NET is included. Requires Windows 10/11 64-bit.

          The app isn't code-signed, so Windows SmartScreen may show *"Windows protected your PC"*. Click **More info → Run anyway**.

          ### Verify the download
          This zip was built by GitHub Actions from the source at this tag ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          - SHA-256: ``${{ steps.pkg.outputs.sha256 }}`` (check it in PowerShell with ``Get-FileHash VocalTuner-win-x64.zip``)
          - Build provenance, with the [GitHub CLI](https://cli.github.com/): ``gh attestation verify VocalTuner-win-x64.zip --repo ${{ github.repository }}``
          "@
          $body | Out-File -Encoding utf8 notes.md
          gh release create $tag VocalTuner-win-x64.zip VocalTuner-win-x64.zip.sha256 --draft --title "Vocal Tuner $($tag.TrimStart('v'))" --notes-file notes.md --verify-tag
